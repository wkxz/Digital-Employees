id: U08
name: 用户用例：全周平稳无异常；纪要称“各区域波动均在±2%以内”，实际华北 -5.51% → 程序生成数据核对说明
category: 边界
# 基准值已用销售明细独立核算（2026-10-24）：区域×品类最大偏离 13.8%（华北日用百货），低于 15% 阈值
input:
  period: 2026-W44
  files:
    sales_file: data/user_cases/case_05_flat_no_anomalies/销售明细_2026W44_平稳.xlsx
    minutes_file: data/user_cases/case_05_flat_no_anomalies/周会纪要_2026W44_平稳.docx
steps:
  - expect:
      state: PENDING_REVIEW
      kpis:
        total.sales: 306881.99
        total.sales_prev: 310425.00
        total.sales_wow: -0.011413
        total.qty: 12274
        total.qty_prev: 12417
        region.华北.sales_wow: -0.055121
        region.华东.sales_wow: 0.001447
        region.西南.share: 0.2574
      anomaly_labels: []
      report_contains:
        - 无需特别关注的异常
        - 数据核对
        - 各区域销售波动均在±2%以内
        - 华北区销售额环比为 -5.51%，超出该范围
      report_not_contains: [华东区销售额环比为, "{{"]
      qc_all_blocking_passed: true
  - review: {decision: approve}
  - expect: {state: DELIVERED, deliverable_files: [经营周报_2026W44.docx, 质检记录.md]}
