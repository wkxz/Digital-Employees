id: U03
name: 用户用例：缺上周数据 → 补传完整的更正版文件 → 旧文件整体作废
category: 缺材料
input:
  employee: weekly_report_demo
  period: 2026-W44
  files:
    sales_file: data/user_cases/case_02_missing_last_week/销售明细_2026W44_单周.xlsx
    minutes_file: data/user_cases/case_02_missing_last_week/周会纪要_2026W44.docx
steps:
  - expect: {state: WAITING_INPUT}
  - supplement: {files: {sales_file: data/user_cases/case_01_normal/销售明细_2026W44.xlsx}}
  - expect:
      state: PENDING_REVIEW
      kpis: {total.sales: 698896.92, total.sales_prev: 788513.78}
      report_contains: [被后上传的更正版替代、未使用的文件：销售明细_2026W44_单周.xlsx]
      report_not_contains: [多份数据合并]
