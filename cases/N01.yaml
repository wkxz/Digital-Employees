id: N01
name: 正常周报 + 审核退回后按意见重做（赛题场景 1）
category: 正常
input:
  period: 2026-W44
  files: {sales_file: data/samples/销售明细_2026W44.xlsx, minutes_file: data/samples/周会纪要_2026W44.docx}
steps:
  - expect:
      state: PENDING_REVIEW
      report_contains: [华东区, 上海徐汇店, 生鲜周, 西南区饮料, 原因待确认, 核心指标, 门店环比 Top / Bottom]
      report_not_contains: ["{{", "环比下降 -"]
  - review: {decision: changes, comments: 华东区下滑原因没说清楚，请结合周会纪要补充}
  - expect: {state: PENDING_REVIEW, version: 2, report_contains: [竞品社区超市], events: [feedback_parsed]}
  - review: {decision: approve}
  - expect:
      state: DELIVERED
      events: [delivered]
      deliverable_files: [经营周报_2026W44.docx, 质检记录.md, qc_report.json, manifest.json]
      step_runs: {load: 1, kpi: 1, analysis: 2, draft: 2}
