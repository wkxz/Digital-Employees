id: U11
name: 用户用例：纪要称“华北区销售额暴跌50%”，交易数据仅 -3.11%（华北不是异常）→ 报告必须有数据核对说明
category: 正常
# 基准值已用销售明细独立核算（2026-10-24），与 case_01 的交易数据一致
input:
  employee: weekly_report_demo
  period: 2026-W44
  files:
    sales_file: data/user_cases/case_08_discrepancy_fact/销售明细_2026W44.xlsx
    minutes_file: data/user_cases/case_08_discrepancy_fact/周会纪要_口头矛盾.docx
steps:
  - expect:
      state: PENDING_REVIEW
      kpis:
        total.sales: 698896.92
        total.sales_prev: 788513.78
        total.sales_wow: -0.113653
        region.华北.sales_wow: -0.031129
        region.华东.sales_wow: -0.533476
        region.华南.share: 0.3143
      anomaly_labels: [华东区, 华南区生鲜食品]
      report_contains:
        - 数据核对
        - 华北区本周销售额暴跌50%
        - 华北区销售额环比为 -3.1%，与会上口径不一致
        - 海贝思
      report_not_contains: ["【华东战区情况】", "【口头汇报矛盾陷阱】", "{{"]
      qc_all_blocking_passed: true
  - review: {decision: approve}
  - expect: {state: DELIVERED, deliverable_files: [经营周报_2026W44.docx, 质检记录.md]}
